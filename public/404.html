<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KreazyAI</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path && path !== '/' && path !== '/index.html') {
          sessionStorage.setItem('spa_redirect', path + search + hash);
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="background: #06080D; color: #FFFFFF; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Loading Kreazy AI...</p>
  </body>
</html>
